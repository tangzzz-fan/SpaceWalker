name: SpaceWalker

options:
  bundleIdPrefix: com.tango
  deploymentTarget:
    iOS: "26.0"
  groupSortPosition: top
  createIntermediateGroups: true

schemes:
  SpaceWalker:
    build:
      targets:
        SpaceWalker: all
        SpaceWalkerTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - SpaceWalkerTests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release

packages:
  TGReduxKit:
    path: "../Tango Vendor Packages/TGReduxKit"
  TGFeatureFlag:
    path: "../Tango Vendor Packages/TGFeatureFlag"

settings:
  base:
    SDKROOT: iphoneos
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    TARGETED_DEVICE_FAMILY: "1,2"
    CLANG_ENABLE_MODULES: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    # 签名：team 固定为 UKXWZ3FS84，由 Xcode 自动管理描述文件
    DEVELOPMENT_TEAM: UKXWZ3FS84
    CODE_SIGN_STYLE: Automatic

targets:
  SpaceWalker:
    type: application
    platform: iOS
    sources:
      - path: Sources
    info:
      path: Supporting/Info.plist
      properties:
        CFBundleDisplayName: SpaceWalker
        NSCameraUsageDescription: "SpaceWalker 需要相机画面，才能把虚拟星图叠加到真实空间。"
        UILaunchScreen:
          UIColorName: ""
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIRequiredDeviceCapabilities:
          - arm64
    dependencies:
      - package: TGReduxKit
        product: TGReduxKit
      - package: TGFeatureFlag
        product: TGFeatureFlag
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tango.spacewalker
        SUPPORTED_PLATFORMS: iphoneos iphonesimulator
        CODE_SIGN_IDENTITY: "Apple Development"
      configs:
        Release:
          CODE_SIGN_IDENTITY: "Apple Distribution"

  SpaceWalkerTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tango.spacewalkertests
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_IDENTITY: "Apple Development"
    dependencies:
      - target: SpaceWalker
