name: SpaceWalker

options:
  bundleIdPrefix: com.tango
  deploymentTarget:
    iOS: "26.0"
  groupSortPosition: top
  createIntermediateGroups: true

schemes:
  SpaceWalker:
    build:
      targets:
        SpaceWalker: all
        SpaceWalkerTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - SpaceWalkerTests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release

  SkyCheck:
    build:
      targets:
        SpaceWalker: all
        SpaceWalkerUITests: [test]
    test:
      config: Debug
      targets:
        - SpaceWalkerUITests

packages:
  TGReduxKit:
    path: "Packages/TGReduxKit"
  TGFeatureFlag:
    path: "Packages/TGFeatureFlag"

settings:
  base:
    SDKROOT: iphoneos
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    TARGETED_DEVICE_FAMILY: "1,2"
    CLANG_ENABLE_MODULES: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    # 签名：team 固定为 UKXWZ3FS84，由 Xcode 自动管理描述文件
    DEVELOPMENT_TEAM: UKXWZ3FS84
    CODE_SIGN_STYLE: Automatic

targets:
  SpaceWalker:
    type: application
    platform: iOS
    sources:
      - path: Sources
    info:
      path: Supporting/Info.plist
      properties:
        CFBundleDisplayName: SpaceWalker
        NSLocationWhenInUseUsageDescription: "SpaceWalker 用你的大致位置与航向，把星图对齐到今夜此刻的真实天空。"
        UILaunchScreen:
          UIColorName: ""
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIRequiredDeviceCapabilities:
          - arm64
    dependencies:
      - package: TGReduxKit
        product: TGReduxKit
      - package: TGFeatureFlag
        product: TGFeatureFlag
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tango.spacewalker
        SUPPORTED_PLATFORMS: iphoneos iphonesimulator
        CODE_SIGN_IDENTITY: "Apple Development"
      configs:
        Release:
          CODE_SIGN_IDENTITY: "Apple Distribution"

  SpaceWalkerTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tango.spacewalkertests
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_IDENTITY: "Apple Development"
    dependencies:
      - target: SpaceWalker

  # 真机/模拟器上的方向与排版验收。`xcodebuild test` 会跑它，
  # 单独拆一个 scheme 是为了不让 280 项单测每次都等 UI 测试。
  SpaceWalkerUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: UITests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tango.spacewalkeruitests
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_IDENTITY: "Apple Development"
    dependencies:
      - target: SpaceWalker
